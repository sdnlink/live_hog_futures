version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qihuo_postgres
    restart: always
    environment:
      POSTGRES_USER: qihuo_user
      POSTGRES_PASSWORD: qihuo_password
      POSTGRES_DB: qihuo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
