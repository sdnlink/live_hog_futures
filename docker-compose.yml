version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qihuo_postgres
    restart: always
    environment:
      POSTGRES_USER: qihuo_user
      POSTGRES_PASSWORD: qihuo_password
      POSTGRES_DB: qihuo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qihuo_backend
    restart: always
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://qihuo_user:qihuo_password@db:5432/qihuo_db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qihuo_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
